name: lavedevelop
description: "Lave mobile app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  path: ^1.9.1
  collection: ^1.19.1
  meta: ^1.18.0
  # 富媒体分片上传要算 md5 / sha1 / md5_10m（官方 upload_prepare 的必填校验值）。
  # 纯 Dart 实现，不带原生代码，因此不影响打包体积与 ABI。
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # 内置 Python 运行时的资产目录。
  #
  # 该目录当前只放说明文件（占位），因此打包体积不受影响。
  # 把交叉编译好的 CPython 按 ABI 放进来即可让插件在 Android 上真正可用：
  #   assets/python/arm64-v8a/python3
  #   assets/python/arm64-v8a/lib/python3.12/…
  # 详见 README「内置 Python 运行时」。
  #
  # 注意：这里必须声明该目录，否则目录不会被编入 assets，
  # 运行时的释放逻辑（PluginRuntime.rootBundleAssetExtractor）就找不到任何资源。
  assets:
    # 示例插件：README 也要打进包，它是插件作者的第一份文档。
    # 逐个文件列出而不是写目录：**Flutter 的资产目录声明不是递归的**，
    # 写 `assets/plugins/demo_plugin/` 只会带上直接文件，将来加了子目录会静默丢失。
    - assets/plugins/demo_plugin/plugin.json
    - assets/plugins/demo_plugin/main.py
    - assets/plugins/demo_plugin/README.md
    - assets/python/arm64-v8a/
    - assets/python/arm64-v8a/lib/
    - assets/python/arm64-v8a/lib/python3.14/
    - assets/python/arm64-v8a/lib/python3.14/__phello__/
    - assets/python/arm64-v8a/lib/python3.14/_pyrepl/
    - assets/python/arm64-v8a/lib/python3.14/asyncio/
    - assets/python/arm64-v8a/lib/python3.14/collections/
    - assets/python/arm64-v8a/lib/python3.14/compression/
    - assets/python/arm64-v8a/lib/python3.14/compression/_common/
    - assets/python/arm64-v8a/lib/python3.14/compression/zstd/
    - assets/python/arm64-v8a/lib/python3.14/concurrent/
    - assets/python/arm64-v8a/lib/python3.14/concurrent/futures/
    - assets/python/arm64-v8a/lib/python3.14/concurrent/interpreters/
    - assets/python/arm64-v8a/lib/python3.14/config-3.14-aarch64-linux-android/
    - assets/python/arm64-v8a/lib/python3.14/ctypes/
    - assets/python/arm64-v8a/lib/python3.14/ctypes/macholib/
    - assets/python/arm64-v8a/lib/python3.14/curses/
    - assets/python/arm64-v8a/lib/python3.14/dbm/
    - assets/python/arm64-v8a/lib/python3.14/email/
    - assets/python/arm64-v8a/lib/python3.14/email/mime/
    - assets/python/arm64-v8a/lib/python3.14/encodings/
    - assets/python/arm64-v8a/lib/python3.14/ensurepip/
    - assets/python/arm64-v8a/lib/python3.14/ensurepip/_bundled/
    - assets/python/arm64-v8a/lib/python3.14/html/
    - assets/python/arm64-v8a/lib/python3.14/http/
    - assets/python/arm64-v8a/lib/python3.14/importlib/
    - assets/python/arm64-v8a/lib/python3.14/importlib/metadata/
    - assets/python/arm64-v8a/lib/python3.14/importlib/resources/
    - assets/python/arm64-v8a/lib/python3.14/json/
    - assets/python/arm64-v8a/lib/python3.14/lib-dynload/
    - assets/python/arm64-v8a/lib/python3.14/logging/
    - assets/python/arm64-v8a/lib/python3.14/multiprocessing/
    - assets/python/arm64-v8a/lib/python3.14/multiprocessing/dummy/
    - assets/python/arm64-v8a/lib/python3.14/pathlib/
    - assets/python/arm64-v8a/lib/python3.14/pydoc_data/
    - assets/python/arm64-v8a/lib/python3.14/re/
    - assets/python/arm64-v8a/lib/python3.14/site-packages/
    - assets/python/arm64-v8a/lib/python3.14/sqlite3/
    - assets/python/arm64-v8a/lib/python3.14/string/
    - assets/python/arm64-v8a/lib/python3.14/sysconfig/
    - assets/python/arm64-v8a/lib/python3.14/tomllib/
    - assets/python/arm64-v8a/lib/python3.14/unittest/
    - assets/python/arm64-v8a/lib/python3.14/urllib/
    - assets/python/arm64-v8a/lib/python3.14/venv/
    - assets/python/arm64-v8a/lib/python3.14/venv/scripts/
    - assets/python/arm64-v8a/lib/python3.14/venv/scripts/common/
    - assets/python/arm64-v8a/lib/python3.14/venv/scripts/posix/
    - assets/python/arm64-v8a/lib/python3.14/wsgiref/
    - assets/python/arm64-v8a/lib/python3.14/xml/
    - assets/python/arm64-v8a/lib/python3.14/xml/dom/
    - assets/python/arm64-v8a/lib/python3.14/xml/etree/
    - assets/python/arm64-v8a/lib/python3.14/xml/parsers/
    - assets/python/arm64-v8a/lib/python3.14/xml/sax/
    - assets/python/arm64-v8a/lib/python3.14/xmlrpc/
    - assets/python/arm64-v8a/lib/python3.14/zipfile/
    - assets/python/arm64-v8a/lib/python3.14/zipfile/_path/
    - assets/python/arm64-v8a/lib/python3.14/zoneinfo/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
