org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 并行构建与构建缓存：本项目模块少，收益主要来自
# 「同一台机器上重复构建」的场景（例如先 debug 再 release）。
org.gradle.parallel=true
org.gradle.caching=true

# 依赖下载失败时的重试次数与超时。
# 本机网络对 Maven 仓库不稳定（实测会在传输中途被中断），
# 默认策略下 Gradle 一次失败就整体失败，这里放宽重试。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000

# 关闭 Kotlin 增量编译。
#
# 原因：本机构的构建多次被外部因素中断（先是磁盘空间耗尽，后是网络中断），
# 增量编译缓存（build/<module>/kotlin/.../caches-jvm/*.tab）会残留损坏，
# 之后每次构建都会失败在「Could not close incremental caches」这类
# 与源码无关的位置上。关闭增量后每次全量编译，换来可重复的构建结果。
kotlin.incremental=false
